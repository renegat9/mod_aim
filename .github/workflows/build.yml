name: Build, Release & Publish Docker (mod_aim Rust)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  unpack-and-build-linux:
    name: Unpack ZIP, Test & Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Auto-Unpack any ZIP archive (if present)
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Archive $z détectée : décompression automatique..."
            unzip -o "$z"
            rm -f "$z"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: décompression automatique de $z"
              git push origin HEAD:main || true
            fi
          done

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit & contract tests
        run: |
          set -o pipefail
          cargo test -- --nocapture 2>&1 | tee cargo_test.log

      - name: Build release binary (aim-daemon)
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee cargo_build.log

      - name: Publish Diagnostic Summary on Failure
        if: failure()
        run: |
          echo "### Diagnostic Cargo" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 cargo_test.log cargo_build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Package Linux Release Archive (Binary + Tools + Docs + Examples + Deploy)
        run: |
          mkdir -p dist/aim-engine-linux-x86_64/{tools,docs,examples,deploy/apache,deploy/systemd}
          cp target/release/aim-daemon dist/aim-engine-linux-x86_64/
          cp tools/*.aim dist/aim-engine-linux-x86_64/tools/
          cp docs/*.md dist/aim-engine-linux-x86_64/docs/ || true
          cp examples/* dist/aim-engine-linux-x86_64/examples/ || true
          cp deploy/config.example.toml dist/aim-engine-linux-x86_64/deploy/ || true
          cp deploy/apache/* dist/aim-engine-linux-x86_64/deploy/apache/ || true
          cp deploy/systemd/* dist/aim-engine-linux-x86_64/deploy/systemd/ || true
          cp README.md README.fr.md LICENSE Dockerfile docker-compose.yml dist/aim-engine-linux-x86_64/ || true
          cd dist && tar -czvf aim-engine-linux-x86_64.tar.gz aim-engine-linux-x86_64

      - name: Upload Compiled Binary Artifact (Linux)
        uses: actions/upload-artifact@v5
        with:
          name: aim-engine-linux-x86_64
          path: |
            target/release/aim-daemon
            dist/aim-engine-linux-x86_64.tar.gz

  build-windows:
    name: Build (Windows x86_64)
    needs: unpack-and-build-linux
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (aim-daemon.exe)
        run: cargo build --release

      - name: Upload Compiled Binary Artifact (Windows)
        uses: actions/upload-artifact@v5
        with:
          name: aim-engine-windows-x86_64
          path: target/release/aim-daemon.exe

  publish-docker-ghcr:
    name: Publish Docker Image (ghcr.io)
    needs: unpack-and-build-linux
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to ghcr.io
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:v2.2.0" .
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:v2.2.0"

  publish-github-release:
    name: Publish GitHub Release (Linux & Windows Binaries)
    needs: [unpack-and-build-linux, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Download Linux Artifact
        uses: actions/download-artifact@v5
        with:
          name: aim-engine-linux-x86_64
          path: release_assets/linux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v5
        with:
          name: aim-engine-windows-x86_64
          path: release_assets/windows

      - name: Create or Update GitHub Release v2.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.2.0"
          LINUX_TAR=$(find release_assets/linux -name "aim-engine-linux-x86_64.tar.gz" | head -n 1)
          WIN_EXE=$(find release_assets/windows -name "aim-daemon.exe" | head -n 1)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$LINUX_TAR" "$WIN_EXE" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$LINUX_TAR" "$WIN_EXE" \
              --repo "${{ github.repository }}" \
              --title "mod_aim v2.2.0 — Standalone Zero-Trust Rust Engine" \
              --notes "Binaires pré-compilés Linux (x86_64) et Windows (x86_64) + Image Docker officielle sur \`ghcr.io/${{ github.repository }}:latest\`."
          fi
