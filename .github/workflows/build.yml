name: Unpack ZIP & Build mod_aim (Rust)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  unpack-and-build-linux:
    name: Unpack ZIP, Test & Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Auto-Unpack any ZIP archive (if present)
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Archive $z détectée : décompression automatique..."
            unzip -o "$z"
            rm -f "$z"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: décompression automatique de $z"
              git push origin HEAD:main || true
            fi
          done

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit & contract tests
        run: |
          set -o pipefail
          cargo test -- --nocapture 2>&1 | tee cargo_test.log

      - name: Build release binary (aim-daemon)
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee cargo_build.log

      - name: Publish Diagnostic Summary on Failure
        if: failure()
        run: |
          echo "### Diagnostic Cargo" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 cargo_test.log cargo_build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Package Linux Release Archive (Binary + Tools + Docs + Examples + Deploy)
        run: |
          mkdir -p dist/aim-engine-linux-x86_64/{tools,docs,examples,deploy/apache,deploy/systemd}
          cp target/release/aim-daemon dist/aim-engine-linux-x86_64/
          cp tools/*.aim dist/aim-engine-linux-x86_64/tools/
          cp docs/*.md dist/aim-engine-linux-x86_64/docs/ || true
          cp examples/* dist/aim-engine-linux-x86_64/examples/ || true
          cp deploy/config.example.toml dist/aim-engine-linux-x86_64/deploy/ || true
          cp deploy/apache/* dist/aim-engine-linux-x86_64/deploy/apache/ || true
          cp deploy/systemd/* dist/aim-engine-linux-x86_64/deploy/systemd/ || true
          cp README.md Dockerfile docker-compose.yml dist/aim-engine-linux-x86_64/ || true
          cd dist && tar -czvf aim-engine-linux-x86_64.tar.gz aim-engine-linux-x86_64

      - name: Upload Compiled Binary Artifact (Linux)
        uses: actions/upload-artifact@v5
        with:
          name: aim-engine-linux-x86_64
          path: |
            target/release/aim-daemon
            dist/aim-engine-linux-x86_64.tar.gz

  build-windows:
    name: Build (Windows x86_64)
    needs: unpack-and-build-linux
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (aim-daemon.exe)
        run: cargo build --release

      - name: Upload Compiled Binary Artifact (Windows)
        uses: actions/upload-artifact@v5
        with:
          name: aim-engine-windows-x86_64
          path: target/release/aim-daemon.exe
